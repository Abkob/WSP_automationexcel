[project]
name = "wsp-offline-app"
version = "1.1.5"
description = "Offline WSP Excel import, analytics, filtering, and export application."
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1,<4",
  "pandas>=3,<4",
  "numpy>=2,<3",
  "SQLAlchemy>=2,<3",
  "fastapi>=0.136,<1",
  "uvicorn>=0.49,<1",
  "plotly>=5,<7",
  "sentence-transformers>=3,<4",
  "faiss-cpu>=1.8,<2",
  "pystray>=0.19,<1",
  "Pillow>=10,<12",
]

[project.optional-dependencies]
test = [
  "pytest>=9,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
